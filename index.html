    <script src="js/i18n.js"></script>
    <script>
        // Aplica o tema salvo e o estilo visual antes do primeiro paint
        (function () {
            var theme = localStorage.getItem("site:theme");
            if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.dataset.theme = theme;

            // glass (padrão) | clay | minimal | liquid | spatial
            var content = window.siteContent || {};
            document.documentElement.dataset.ui = (content.theme || {}).style || "glass";

            // theme.hoverZoom: false desliga o crescer ao passar o mouse
            if ((content.theme || {}).hoverZoom === false) {
                document.documentElement.dataset.hoverZoom = "off";
            }
        })();
    </script>
